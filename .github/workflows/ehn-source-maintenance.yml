name: EHN source maintenance

on:
  push:
    branches: [formalize/ehn-functions]
    paths: [.github/workflows/ehn-source-maintenance.yml]

permissions:
  contents: write

concurrency:
  group: ehn-source-maintenance
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: formalize/ehn-functions
      - name: Apply the guarded interface cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          names = [
              'Structure/GeneratedWeakHomImage',
              'Functional/WeakInduced', 'Functional/WeakInvariant',
              'Functional/WeakOperations', 'Functional/WeakAttachment',
              'Functional/EHNStage', 'Functional/EHNInitial',
              'Functional/EHNPicture', 'Functional/EHNConstruction',
              'Ramsey/FreeAmalgamationFunctions', 'Ramsey/ForbiddenFunctions',
          ]
          for name in names:
              p = Path('PartiteConstruction') / (name + '.lean')
              text = p.read_text()
              text = re.sub(r'\.over\b', '.isPartite', text)
              text = re.sub(r'^(\s*)over\s*:', r'\1isPartite :', text, flags=re.M)
              if 'set_option autoImplicit false' not in text:
                  lines = text.splitlines(keepends=True)
                  last_import = max(i for i, line in enumerate(lines) if line.startswith('import '))
                  lines.insert(last_import + 1, '\nset_option autoImplicit false\n')
                  text = ''.join(lines)
              p.write_text(text)
          p = Path('PartiteConstruction/Structure/WeakHomomorphism.lean')
          text = p.read_text()
          old = '''/-! The stronger claim that an arbitrary weak quotient preserves the
          free-amalgamation irreducibility predicate is intentionally not asserted here:
          the ordinary full-homomorphism proof uses fibre surjectivity, which weak
          homomorphisms do not provide. -/'''
          new = '''/-! Weak quotients need not preserve exact function fibres. Nevertheless,
          irreducibility is preserved by generating weak maps: see
          `GeneratedWeakHomImage.lean`. That proof pulls back closed decomposition
          sides and only uses forward incidence preservation. In particular it also
          applies to the closed hull of a coordinate image. -/'''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))
          p = Path('PartiteConstruction.lean')
          text = p.read_text()
          for module in ['PartiteConstruction.Functional.FreeAmalgamClosed',
                         'PartiteConstruction.Functional.HalfClosedTheorem',
                         'PartiteConstruction.Functional.QuotientFibreObstruction',
                         'PartiteConstruction.Ramsey.ForbiddenFunctions']:
              line = 'import ' + module
              if line not in text.splitlines():
                  text += '\n' + line + '\n'
          p.write_text(text)
          PY
          git diff --check
          git add PartiteConstruction.lean PartiteConstruction
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Normalize EHN stage fields, disable implicit declarations, and export the functional endpoints'
          git push origin HEAD:formalize/ehn-functions
          echo "PROOF_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan and restore Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get Mathlib.Tactic Mathlib.Data.Fintype.Pi Mathlib.Data.Fintype.Basic Mathlib.Data.Finset.Dedup > cache.log 2>&1 || { tail -80 cache.log; exit 1; }
      - name: Build and audit the committed source
        run: |
          set -euo pipefail
          echo "Checking committed source $PROOF_SHA"
          mapfile -t targets < <(sed -n 's/^import //p' CheckAxioms.lean CheckClosureAxioms.lean CheckEHNFunctions.lean | sort -u)
          if ! lake build PartiteConstruction "${targets[@]}" > build.log 2>&1; then
            sed -n '/error:/,$p' build.log
            exit 1
          fi
          tail -1 build.log
          : > axioms.log
          for source in CheckAxioms.lean CheckClosureAxioms.lean CheckEHNFunctions.lean; do
            lake env lean "$source" >> axioms.log 2>&1 || { tail -100 axioms.log; exit 1; }
          done
          python3 scripts/check_axioms.py axioms.log CheckAxioms.lean CheckClosureAxioms.lean CheckEHNFunctions.lean
