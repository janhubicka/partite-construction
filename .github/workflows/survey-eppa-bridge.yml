name: Survey EPPA definition bridge

on:
  push:
    paths:
      - 'SurveyEPPAValidation/**'
      - '.github/workflows/survey-eppa-bridge.yml'
  pull_request:
    paths:
      - 'SurveyEPPAValidation/**'
      - '.github/workflows/survey-eppa-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: survey-eppa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: SurveyEPPAValidation
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned EPPA and Mathlib dependencies
        run: lake update

      - name: Get Lean Mathlib build cache
        run: lake exe cache get

      - name: Build the survey EPPA bridge
        run: lake build SurveyEPPA SurveyEPPAAmalgamation SurveyEPPACompletion SurveyEPPANullary SurveyEPPAClassNullary SurveyEPPAClassNullaryDirect SurveyEPPAForbidden SurveyEPPAForbiddenNullary SurveyEPPATree SurveyEPPAForbiddenArbitrary

      - name: Axiom audit (no sorry)
        run: |
          set -o pipefail
          lake env lean AxiomAudit.lean 2>&1 | tee axiom-output.log
          if grep -Fq 'sorryAx' axiom-output.log; then
            echo 'Unexpected sorryAx in survey proof dependency closure'
            exit 1
          fi
