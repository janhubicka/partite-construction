name: Rooted reduction proof check

on:
  push:
    branches: [formalize/nullary-full-reduction]
    paths: [.github/workflows/rooted-reduction-ci.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: rooted-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: rooted-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            rooted-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Fintype.Pi Mathlib.Data.Fintype.Basic Mathlib.Data.Finset.Dedup
      - name: Build rooted reduction
        run: |
          set -euo pipefail
          lake build PartiteConstruction.Structure.RootedReduction PartiteConstruction.Structure.RootedFunctor PartiteConstruction.Structure.RootedSplit PartiteConstruction.Structure.RootedCorrectness PartiteConstruction.Structure.RootedFreeAmalgam
      - name: Audit EHN closure
        run: |
          set -euo pipefail
          lake env lean CheckEHNFunctions.lean > axioms.log
          python3 scripts/check_axioms.py axioms.log CheckEHNFunctions.lean

# tuple canonicalization pass
